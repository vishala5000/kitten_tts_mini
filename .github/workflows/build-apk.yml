name: Build Kitten TTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      NDK_VERSION: "28.1.13356709"
      GRADLE_VERSION: "8.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"
          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt2" version
          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/d8" --version
          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign" --help >/dev/null
          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" --version

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/gradle"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$HOME/gradle/gradle.zip"

          unzip -q \
            "$HOME/gradle/gradle.zip" \
            -d "$HOME/gradle"

          echo "$HOME/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Download Kitten TTS model
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets/model

          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            "${BASE_URL}/kitten_tts_mini_v0_8.onnx" \
            -o app/src/main/assets/model/kitten_tts_mini_v0_8.onnx

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "${BASE_URL}/config.json" \
            -o app/src/main/assets/model/config.json

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            "${BASE_URL}/voices.npz" \
            -o app/src/main/assets/model/voices.npz

          echo "Downloaded files:"
          ls -lh app/src/main/assets/model

      - name: Verify Kitten TTS model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/model"

          test -s "${MODEL_DIR}/kitten_tts_mini_v0_8.onnx"
          test -s "${MODEL_DIR}/config.json"
          test -s "${MODEL_DIR}/voices.npz"

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/model/config.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("config.json loaded successfully")
          print("Top-level keys:", list(data.keys()))
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Locate APK
        shell: bash
        run: |
          set -e

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KittenTTS-Android-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
