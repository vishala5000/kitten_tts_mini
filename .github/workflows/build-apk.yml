name: Build & Release Kitten TTS Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kitten' # Triggers when you push the 'kitten' tag

# Grant permission to write to releases
permissions:
  contents: write

jobs:
  build:
    name: Build and Upload APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated."

      # --- NEW STEP: Upload to GitHub Release ---
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kitten
          files: app/build/outputs/apk/debug/app-debug.apk
          name: "Kitten TTS Mini Build"
          body: "Automated build of Kitten TTS Mini APK"
          fail_on_unmatched_files: true
