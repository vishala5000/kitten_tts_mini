name: Build Kitten TTS Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "28.1.13356709"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Download TTS Models from Release
        run: |
          set -e
          echo "Creating assets/model directory..."
          mkdir -p app/src/main/assets/model
          
          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"
          
          echo "Downloading model files..."
          curl -L -o app/src/main/assets/model/config.json "$BASE_URL/config.json"
          curl -L -o app/src/main/assets/model/kitten_tts_mini_v0_8.onnx "$BASE_URL/kitten_tts_mini_v0_8.onnx"
          curl -L -o app/src/main/assets/model/voices.npz "$BASE_URL/voices.npz"
          
          echo "Verifying downloaded files..."
          ONNX_SIZE=$(stat -c%s "app/src/main/assets/model/kitten_tts_mini_v0_8.onnx")
          if [ "$ONNX_SIZE" -lt 1000000 ]; then
            echo "ERROR: The ONNX model is too small ($ONNX_SIZE bytes). Download failed!"
            exit 1
          fi
          
          echo "Models downloaded successfully!"
          ls -lh app/src/main/assets/model/

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitten-TTS-Mini-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
