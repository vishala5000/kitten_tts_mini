name: Build Kitten TTS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Download model release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/model
          base="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"
          curl -fL --retry 5 --retry-all-errors "$base/kitten_tts_mini_v0_8.onnx" -o app/src/main/assets/model/kitten_tts_mini_v0_8.onnx
          curl -fL --retry 5 --retry-all-errors "$base/config.json" -o app/src/main/assets/model/config.json
          curl -fL --retry 5 --retry-all-errors "$base/voices.npz" -o app/src/main/assets/model/voices.npz
          test -s app/src/main/assets/model/kitten_tts_mini_v0_8.onnx
          test -s app/src/main/assets/model/config.json
          test -s app/src/main/assets/model/voices.npz

      - name: Build native Rust engine
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          cd native
          cargo build --release --target aarch64-linux-android
          cd ..
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/target/aarch64-linux-android/release/libkitten_android.so app/src/main/jniLibs/arm64-v8a/
          find native/target/aarch64-linux-android/release -name 'libonnxruntime.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \; || true
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libonnxruntime.so ]; then
            find "$HOME/.cargo" -name 'libonnxruntime.so' -exec cp {} app/src/main/jniLibs/arm64-v8a/ \; || true
          fi
          test -f app/src/main/jniLibs/arm64-v8a/libkitten_android.so
          test -f app/src/main/jniLibs/arm64-v8a/libonnxruntime.so

      - name: Download Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors             https://services.gradle.org/distributions/gradle-8.13-bin.zip             -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/KittenTTS-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittenTTS-Android
          path: dist/KittenTTS-release-unsigned.apk
          if-no-files-found: error
