name: Build Kitten TTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      NDK_VERSION: "28.1.13356709"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install required Android packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|ndk;${NDK_VERSION}" \
            || true

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x ./gradlew

      - name: Download Kitten TTS model
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets/model

          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"

          curl -fL --retry 5 --retry-delay 3 \
            "${BASE_URL}/kitten_tts_mini_v0_8.onnx" \
            -o app/src/main/assets/model/kitten_tts_mini_v0_8.onnx

          curl -fL --retry 5 --retry-delay 3 \
            "${BASE_URL}/config.json" \
            -o app/src/main/assets/model/config.json

          curl -fL --retry 5 --retry-delay 3 \
            "${BASE_URL}/voices.npz" \
            -o app/src/main/assets/model/voices.npz

          echo "Downloaded model files:"
          ls -lh app/src/main/assets/model

      - name: Verify model files
        shell: bash
        run: |
          set -e

          test -s app/src/main/assets/model/kitten_tts_mini_v0_8.onnx
          test -s app/src/main/assets/model/config.json
          test -s app/src/main/assets/model/voices.npz

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/model/config.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("config.json loaded successfully")
          print("Top-level keys:", list(data.keys()))
          PY

      - name: Build release APK
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Locate APK
        shell: bash
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KittenTTS-Android-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
