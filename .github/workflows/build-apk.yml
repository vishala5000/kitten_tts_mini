name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    # Pinned to 24.04 to avoid the "ubuntu-latest migrating to Ubuntu 26" notice
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # Updated from v4 to v6 to clear the official deprecation warning
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: gradle --version

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleTitleGenerator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
