name: Build Kitten TTS Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # --- NEW STEP: Download Models from Release ---
      - name: Download TTS Models from Release
        run: |
          echo "Creating assets directory..."
          mkdir -p app/src/main/assets
          
          echo "Downloading model files from 'kitten' release..."
          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"
          
          curl -L -o app/src/main/assets/config.json "$BASE_URL/config.json"
          curl -L -o app/src/main/assets/kitten_tts_mini_v0_8.onnx "$BASE_URL/kitten_tts_mini_v0_8.onnx"
          curl -L -o app/src/main/assets/voices.npz "$BASE_URL/voices.npz"
          
          echo "Verifying downloaded files..."
          ls -lh app/src/main/assets/

      - name: Show Java version
        run: java -version

      - name: Show Gradle version
        run: gradle --version

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          echo "Checking generated APK..."
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitten-TTS-Mini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
