name: Build Kitten TTS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"
      NDK_VERSION: "28.1.13356709"
      GRADLE_VERSION: "8.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT}"
          BT="${SDK}/build-tools/${BUILD_TOOLS}"

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d "${SDK}/platforms/android-${ANDROID_API}"
          test -d "${BT}"
          test -d "${SDK}/ndk/${NDK_VERSION}"

          test -x "${BT}/aapt2"
          test -x "${BT}/d8"
          test -x "${BT}/zipalign"
          test -x "${BT}/apksigner"

          "${BT}/aapt2" version
          "${BT}/d8" --version
          "${BT}/apksigner" --version

          echo "Android SDK verification successful."

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          mkdir -p "${HOME}/gradle"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "${HOME}/gradle/gradle.zip"

          unzip -q \
            "${HOME}/gradle/gradle.zip" \
            -d "${HOME}/gradle"

          echo "${HOME}/gradle/gradle-${GRADLE_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e
          gradle --version

      - name: Download Kitten TTS model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/model"
          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"

          mkdir -p "${MODEL_DIR}"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            "${BASE_URL}/kitten_tts_mini_v0_8.onnx" \
            -o "${MODEL_DIR}/kitten_tts_mini_v0_8.onnx"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            "${BASE_URL}/config.json" \
            -o "${MODEL_DIR}/config.json"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            "${BASE_URL}/voices.npz" \
            -o "${MODEL_DIR}/voices.npz"

          echo "Downloaded model files:"
          ls -lh "${MODEL_DIR}"

      - name: Verify Kitten TTS model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/model"

          test -s "${MODEL_DIR}/kitten_tts_mini_v0_8.onnx"
          test -s "${MODEL_DIR}/config.json"
          test -s "${MODEL_DIR}/voices.npz"

          python3 - <<'PY'
          import json

          path = "app/src/main/assets/model/config.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("config.json loaded successfully")
          print("Top-level keys:", list(data.keys()))
          PY

      - name: Check Android project
        shell: bash
        run: |
          set -e

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          echo "Android project files found."

      - name: Build release APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/release"

          test -d "${APK_DIR}"

          APK="$(find "${APK_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "${APK}"
          test -s "${APK}"

          echo "APK=${APK}"
          ls -lh "${APK}"

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "${APK}"

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            "${APK}"

      - name: Check APK alignment
        shell: bash
        run: |
          set -e

          APK="$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "${APK}"

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 16 \
            -v \
            4 \
            "${APK}"

      - name: Rename final APK
        shell: bash
        run: |
          set -e

          APK="$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          test -n "${APK}"

          cp "${APK}" \
            "app/build/outputs/apk/release/KittenTTS-Release.apk"

          ls -lh \
            "app/build/outputs/apk/release/KittenTTS-Release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KittenTTS-Android-Release
          path: app/build/outputs/apk/release/KittenTTS-Release.apk
          if-no-files-found: error
