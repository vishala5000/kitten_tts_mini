name: Build & Sign Kitten TTS Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "28.1.13356709"
  GRADLE_VERSION: "8.13"

jobs:
  build:
    name: Build and Sign Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Download TTS Models from Release
        run: |
          set -e
          echo "Creating assets/model directory..."
          mkdir -p app/src/main/assets/model
          
          BASE_URL="https://github.com/vishala5000/kitten_tts_mini/releases/download/kitten"
          
          echo "Downloading model files..."
          curl -L -o app/src/main/assets/model/config.json "$BASE_URL/config.json"
          curl -L -o app/src/main/assets/model/kitten_tts_mini_v0_8.onnx "$BASE_URL/kitten_tts_mini_v0_8.onnx"
          curl -L -o app/src/main/assets/model/voices.npz "$BASE_URL/voices.npz"
          
          echo "Verifying downloaded files (Safety Check)..."
          ONNX_SIZE=$(stat -c%s "app/src/main/assets/model/kitten_tts_mini_v0_8.onnx")
          if [ "$ONNX_SIZE" -lt 1000000 ]; then
            echo "ERROR: The ONNX model is too small ($ONNX_SIZE bytes). Download failed!"
            exit 1
          fi
          
          echo "Models downloaded successfully!"
          ls -lh app/src/main/assets/model/

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate unsigned APK
        id: apk
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)"
          test -n "${APK}"
          echo "Found unsigned APK: ${APK}"
          echo "apk=${APK}" >> "${GITHUB_OUTPUT}"

      - name: Generate release signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KITTEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KITTEN_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "ERROR: Secrets KITTEN_KEYSTORE_PASSWORD and KITTEN_KEY_PASSWORD are required."
            exit 1
          fi
          keytool -genkeypair -v -keystore kitten-release.jks -alias kitten -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${KEYSTORE_PASSWORD}" -keypass "${KEY_PASSWORD}" \
            -dname "CN=Kitten TTS, OU=Android, O=Vishala, L=India, ST=Karnataka, C=IN"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KITTEN_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KITTEN_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED="${{ steps.apk.outputs.apk }}"
          SIGNED="app/build/outputs/apk/release/Kitten-TTS-Mini-release-signed.apk"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          
          "${APKSIGNER}" sign \
            --ks kitten-release.jks \
            --ks-key-alias kitten \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED}" \
            "${UNSIGNED}"
          
          echo "Signed APK:"
          ls -lh "${SIGNED}"

      - name: Verify signed APK
        run: |
          set -e
          APK="app/build/outputs/apk/release/Kitten-TTS-Mini-release-signed.apk"
          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "${APK}"
          echo "=========================================="
          echo "SIGNED APK VERIFIED SUCCESSFULLY"
          echo "=========================================="

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitten-TTS-Mini-release-signed-apk
          path: app/build/outputs/apk/release/Kitten-TTS-Mini-release-signed.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f kitten-release.jks
